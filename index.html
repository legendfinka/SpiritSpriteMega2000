<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8432b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SpiritSpriteMega2000</title>
  </head>
  <body>
    <!-- wobble filters for the CSS -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="rough-sm" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3" />
        <feDisplacementMap in="SourceGraphic" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- analytics; stays after the app script, which strips share links from the URL first -->
    <script
      defer
      src="https://countmetrics-api.onrender.com/tracker.js"
      data-site-key="cm_THjkpagfAJ8-"
    ></script>
  </body>
</html>
