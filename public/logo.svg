<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- SpiritSpriteMega2000: a spirit peeking over a panel block -->
  <defs>
    <clipPath id="badge"><rect x="2" y="2" width="116" height="116" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <!-- dusk sky -->
    <rect width="120" height="120" fill="#e3a92b"/>
    <circle cx="22" cy="24" r="10" fill="#ffd36b" stroke="#2b1d18" stroke-width="3"/>

    <!-- spirit (behind the roof) -->
    <path d="M38 60 L38 34 C38 19 48 10 60 10 C72 10 82 19 82 34 L82 60 Z" fill="#ffffff" stroke="#2b1d18" stroke-width="4" stroke-linejoin="round"/>
    <path d="M44 28 Q52 16 62 16" fill="none" stroke="#d5e5dc" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="52" cy="33" rx="4" ry="5.5" fill="#2b1d18"/>
    <ellipse cx="68" cy="33" rx="4" ry="5.5" fill="#2b1d18"/>
    <circle cx="50.5" cy="31" r="1.6" fill="#ffffff"/>
    <circle cx="66.5" cy="31" r="1.6" fill="#ffffff"/>
    <ellipse cx="46" cy="42" rx="4.5" ry="2.3" fill="#f08a7a"/>
    <ellipse cx="74" cy="42" rx="4.5" ry="2.3" fill="#f08a7a"/>
    <path d="M56 42 Q60 46 64 42" fill="none" stroke="#2b1d18" stroke-width="2.5" stroke-linecap="round"/>

    <!-- roof antenna -->
    <path d="M96 52 V30 M89 34 H103 M91 40 H101" fill="none" stroke="#2b1d18" stroke-width="3" stroke-linecap="round"/>

    <!-- panel block -->
    <rect x="16" y="50" width="88" height="80" fill="#bcb6ab" stroke="#2b1d18" stroke-width="4"/>
    <path d="M16 74 H104 M16 96 H104 M45 50 V130 M75 50 V130" stroke="#8f897f" stroke-width="2"/>
    <g stroke="#2b1d18" stroke-width="3">
      <rect x="23" y="57" width="15" height="11" fill="#2c3e57"/>
      <rect x="53" y="57" width="15" height="11" fill="#ffd36b"/>
      <rect x="82" y="57" width="15" height="11" fill="#2c3e57"/>
      <rect x="23" y="79" width="15" height="11" fill="#ffd36b"/>
      <rect x="53" y="79" width="15" height="11" fill="#2c3e57"/>
      <rect x="82" y="79" width="15" height="11" fill="#ffd36b"/>
      <rect x="23" y="101" width="15" height="11" fill="#2c3e57"/>
      <rect x="53" y="101" width="15" height="11" fill="#2c3e57"/>
      <rect x="82" y="101" width="15" height="11" fill="#2c3e57"/>
    </g>
  </g>
  <rect x="2" y="2" width="116" height="116" rx="22" fill="none" stroke="#2b1d18" stroke-width="4"/>
</svg>
