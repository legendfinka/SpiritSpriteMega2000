<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c2b"/>
      <stop offset="1" stop-color="#3a3560"/>
    </linearGradient>
    <pattern id="city" width="120" height="80" patternUnits="userSpaceOnUse">
      <rect width="120" height="80" fill="#2a2f42"/>
      <rect x="14" y="20" width="22" height="26" fill="#1b2738"/>
      <rect x="50" y="20" width="22" height="26" fill="#ffd36b"/>
      <rect x="86" y="20" width="22" height="26" fill="#1b2738"/>
    </pattern>
  </defs>

  <!-- night sky, moon, stars -->
  <rect width="1920" height="1080" fill="url(#night)"/>
  <circle cx="1560" cy="190" r="70" fill="#f7eedb"/>
  <circle cx="1588" cy="172" r="64" fill="#1c2436"/>
  <path d="M200 120 h4 M420 80 h4 M700 160 h4 M980 70 h4 M1240 140 h4 M1780 110 h4 M560 260 h4 M1100 240 h4" stroke="#f7eedb" stroke-width="5" stroke-linecap="round"/>

  <!-- city skyline -->
  <g stroke="#0e0a08" stroke-width="5">
    <rect x="-10" y="430" width="420" height="420" fill="url(#city)"/>
    <rect x="460" y="360" width="300" height="490" fill="url(#city)"/>
    <rect x="1180" y="400" width="360" height="450" fill="url(#city)"/>
    <rect x="1590" y="460" width="340" height="390" fill="url(#city)"/>
  </g>
  <path d="M610 360 V300 M596 314 H624 M1360 400 V330 M1344 346 H1376" stroke="#0e0a08" stroke-width="6" stroke-linecap="round"/>

  <!-- rooftop: parapet and gravel -->
  <rect y="760" width="1920" height="320" fill="#6f6a63"/>
  <rect x="-10" y="740" width="1940" height="40" fill="#8f897f" stroke="#0e0a08" stroke-width="6"/>
  <path d="M0 900 h1920" stroke="#5b5752" stroke-width="80" stroke-dasharray="2 26"/>

  <!-- washing line with sheets -->
  <path d="M200 760 V520 M1720 760 V520" stroke="#0e0a08" stroke-width="12" stroke-linecap="round"/>
  <path d="M200 530 Q960 600 1720 530" fill="none" stroke="#0e0a08" stroke-width="4"/>
  <g stroke="#0e0a08" stroke-width="5" stroke-linejoin="round">
    <path d="M360 546 L520 560 L514 700 L366 690 Z" fill="#ece4d0"/>
    <path d="M1400 560 L1540 548 L1546 660 L1404 670 Z" fill="#b8432b"/>
    <path d="M1590 544 L1660 538 L1664 610 L1592 616 Z" fill="#e3a92b"/>
  </g>

  <!-- a warm string of lights -->
  <path d="M200 600 Q960 680 1720 600" fill="none" stroke="#0e0a08" stroke-width="3"/>
  <path d="M200 600 Q960 680 1720 600" fill="none" stroke="#ffd36b" stroke-width="10" stroke-dasharray="1 60" stroke-linecap="round"/>
</svg>
