<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="tiles" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#f7f1e3"/>
      <rect width="40" height="40" fill="#d5e5dc"/>
      <rect x="40" y="40" width="40" height="40" fill="#d5e5dc"/>
      <path d="M0 0.5 H80 M0 40 H80 M0.5 0 V80 M40 0 V80" stroke="#b9c7bf" stroke-width="2"/>
    </pattern>
    <pattern id="lino" width="140" height="140" patternUnits="userSpaceOnUse">
      <rect width="140" height="140" fill="#c9a27a"/>
      <path d="M70 0 L140 70 L70 140 L0 70 Z" fill="#a9774f"/>
    </pattern>
  </defs>

  <!-- walls and floor -->
  <rect width="1920" height="520" fill="#f3ead6"/>
  <rect y="520" width="1920" height="340" fill="url(#tiles)"/>
  <rect y="860" width="1920" height="220" fill="url(#lino)"/>
  <path d="M0 520 H1920 M0 860 H1920" stroke="#2b1d18" stroke-width="6"/>

  <!-- clock -->
  <circle cx="560" cy="210" r="72" fill="#f7eedb" stroke="#2b1d18" stroke-width="8"/>
  <path d="M560 210 V160 M560 210 L595 228" stroke="#2b1d18" stroke-width="7" stroke-linecap="round"/>

  <!-- window -->
  <rect x="880" y="110" width="460" height="430" fill="#f3ead6" stroke="#2b1d18" stroke-width="8"/>
  <rect x="910" y="140" width="400" height="370" fill="#f6c177" stroke="#2b1d18" stroke-width="6"/>
  <rect x="910" y="330" width="400" height="180" fill="#d9817a"/>
  <g fill="#7a6f8a">
    <rect x="930" y="380" width="120" height="130"/>
    <rect x="1170" y="350" width="140" height="160"/>
  </g>
  <path d="M1110 140 V510" stroke="#f3ead6" stroke-width="14"/>
  <!-- cafe curtain -->
  <path d="M900 330 H1320 V420 Q1215 450 1110 420 Q1005 450 900 420 Z" fill="#e3a92b" stroke="#2b1d18" stroke-width="6" stroke-linejoin="round"/>
  <path d="M900 330 H1320" stroke="#2b1d18" stroke-width="10" stroke-linecap="round"/>

  <!-- cabinets and counter -->
  <g stroke="#2b1d18" stroke-width="6" stroke-linejoin="round">
    <rect x="-10" y="610" width="720" height="250" fill="#ece4d0"/>
    <path d="M230 610 V860 M470 610 V860" fill="none"/>
    <rect x="-10" y="584" width="740" height="30" fill="#b8432b"/>
    <!-- kettle -->
    <path d="M300 584 C290 520 310 480 360 480 C410 480 430 520 420 584 Z" fill="#2f7d77"/>
    <path d="M420 540 L460 505" fill="none" stroke-width="10" stroke-linecap="round"/>
    <path d="M335 470 Q360 445 385 470" fill="none"/>
  </g>
  <path d="M200 730 h20 M440 730 h20 M680 730 h20" stroke="#2b1d18" stroke-width="8" stroke-linecap="round"/>

  <!-- fridge -->
  <g stroke="#2b1d18" stroke-width="7" stroke-linejoin="round">
    <rect x="1500" y="290" width="300" height="580" rx="48" fill="#f7f7f2"/>
    <path d="M1500 520 H1800" fill="none"/>
    <path d="M1535 380 V460 M1535 560 V660" fill="none" stroke-width="12" stroke-linecap="round"/>
  </g>
  <rect x="1610" y="330" width="80" height="22" fill="#b8432b" stroke="#2b1d18" stroke-width="4"/>
</svg>
